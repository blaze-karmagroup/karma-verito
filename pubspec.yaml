name: karma_verito
description: "Attendance management Flutter App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  http: ^1.5.0
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2

  cupertino_icons: ^1.0.8
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-Thin.ttf
          weight: 300
        - asset: assets/fonts/Inter_18pt-Light.ttf
          weight: 200
